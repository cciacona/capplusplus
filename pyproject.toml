[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capplus-inspect"
version = "0.2.0"
description = "Non-destructive inspection and export tools for user-supplied Capitalism Plus data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Cap++ contributors"}]
keywords = ["reverse-engineering", "game-data", "capitalism-plus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.scripts]
capplus-inspect = "capplus_inspect.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
